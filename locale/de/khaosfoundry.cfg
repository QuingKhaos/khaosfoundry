[mod-setting-description]
khaosfoundry-hydrocarbon=Welcher Kohlenwasserstoff für die Gießerei verwendet werden soll. Das Gießereigebäude wird auch zum Koksen verwendet.\nWenn "[color=cyan]Koks[/color]": Bei Bedarf wird ein Rezept und ein Gegenstand für [color=cyan]Koks[/color], hinzugefügt.\nWenn [color=cyan]Festbrennstoff[/color]: wird ein frühtes, aber ineffizientes Rezept hinzugefügt.\nWenn [color=cyan]Kohle[/color], wird das verwendet.\nWenn [color=cyan]keines[/color], wird bei der Gießerei kein Kohlenwasserstoff verwendet (nicht empfohlen).
khaosfoundry-hydrocarbon-from-wood=Funktioniert mit Koks- und Festbrennstoff als Kohlenwasserstoff, aber nicht mit Kohle.

